name: Validate skill

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.20.0
      - name: Lint release scripts
        run: shellcheck scripts/package-skill.sh scripts/validate-release.sh
      - name: Validate Claude plugin metadata
        run: npx --yes @anthropic-ai/claude-code@2.1.233 plugin validate --strict .
      - name: Validate manifests, content, and package
        run: ./scripts/validate-release.sh
