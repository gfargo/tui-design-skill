name: Validate skill

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README promises Python 3.9+; test the floor and the current release.
        python: ["3.9", "3.14"]
    name: validate (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # validate-evidence.sh snapshots the commit recorded in each evidence bundle.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install schema validator for the conformance test
        run: python -m pip install jsonschema==4.25.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.20.0
      - name: Lint release scripts
        run: shellcheck scripts/package-skill.sh scripts/validate-release.sh scripts/validate-evidence.sh scripts/check-samples.sh
      - name: Validate Claude plugin metadata
        run: npx --yes @anthropic-ai/claude-code@2.1.233 plugin validate --strict .
      - name: Validate manifests, content, and package
        run: ./scripts/validate-release.sh
      - name: Revalidate committed evidence bundles
        run: ./scripts/validate-evidence.sh
