name: Validate skill

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
      - name: Lint release scripts
        run: shellcheck scripts/package-skill.sh scripts/validate-release.sh
      - name: Validate Claude plugin metadata
        run: npx --yes @anthropic-ai/claude-code@2.1.233 plugin validate --strict .
      - name: Validate manifests, content, and package
        run: ./scripts/validate-release.sh
